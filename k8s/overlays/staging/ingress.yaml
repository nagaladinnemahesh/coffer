apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: coffer-staging-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "coffer-staging-ingress-ip"
    networking.gke.io/managed-certificates: "coffer-staging-certificate"

spec:
  rules:
    - host: staging.coffer.34.8.23.46.nip.io
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: coffer-backend
                port:
                  number: 3000

          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: coffer-backend
                port:
                  number: 3000

          - path: /email
            pathType: Prefix
            backend:
              service:
                name: coffer-backend
                port:
                  number: 3000

          - path: /reply-ai
            pathType: Prefix
            backend:
              service:
                name: coffer-backend
                port:
                  number: 3000

          - path: /reply
            pathType: Prefix
            backend:
              service:
                name: coffer-backend
                port:
                  number: 3000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: coffer-frontend
                port:
                  number: 80
